<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaunchKit AI</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#080d19;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.shell{max-width:1100px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.logo{font-weight:900;font-size:20px}.pill{font-size:12px;border:1px solid #29344d;border-radius:99px;padding:7px 10px;color:#9fc8ff}
h1{font-size:clamp(38px,7vw,72px);line-height:.98;letter-spacing:-3px;margin:0 0 15px}.sub{color:#a8b1c5;max-width:720px;font-size:18px;line-height:1.5}
.grid{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:32px}.panel{background:#101728;border:1px solid #26314a;border-radius:18px;padding:18px}
button,.btn{width:100%;text-align:left;border:1px solid #2c3854;background:#131d32;color:#f5f7fb;padding:12px 13px;border-radius:11px;margin:5px 0;cursor:pointer;font-weight:700}
button.active{background:#f5f7fb;color:#0a1020}.run{background:#f5f7fb;color:#0a1020;text-align:center;margin-top:12px}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 7px} input,textarea{width:100%;border:1px solid #2b3752;background:#0b1221;color:#fff;border-radius:10px;padding:12px;font:inherit}
textarea{min-height:120px;resize:vertical}.result{white-space:pre-wrap;line-height:1.6;color:#e8edf8;min-height:260px}.muted{color:#98a5bd;font-size:13px}.status{margin:12px 0;color:#9fc8ff}
@media(max-width:760px){.grid{grid-template-columns:1fr}h1{letter-spacing:-2px}}
</style>
</head>
<body><div class="shell">
<div class="top"><div class="logo">LaunchKit</div><div class="pill">AI Application Studio</div></div>
<h1>Apply smarter.</h1><div class="sub">Tell LaunchKit what you're applying for and what you've actually done. LaunchKit generates the result here — no copy-pasting prompts into another AI.</div>
<div class="grid">
<div class="panel">
<div class="muted" style="margin-bottom:8px">WORKFLOW</div>
<button class="active" data-mode="opportunity">Opportunity Analyzer</button>
<button data-mode="cv">CV Tailor</button>
<button data-mode="bullet">Achievement Builder</button>
<button data-mode="statement">Statement Writer</button>
<button data-mode="interview">Interview Coach</button>
<button data-mode="email">Email Writer</button>
<button data-mode="qa">Application QA</button>
</div>
<div>
<div class="panel">
<label>Opportunity / goal</label><input id="target" placeholder="e.g. Scholarship, internship, university program">
<label>Official description / requirements</label><textarea id="requirements" placeholder="Paste the real requirements or opportunity description here"></textarea>
<label>Your real background</label><textarea id="background" placeholder="Your grades, experience, activities, achievements, skills — only real information"></textarea>
<label>Extra instructions</label><input id="extra" placeholder="e.g. concise, formal, 500 words max">
<button class="run" id="run">Generate with LaunchKit AI →</button>
<div id="status" class="status"></div>
</div>
<div class="panel" style="margin-top:18px"><div class="muted">RESULT</div><div id="result" class="result">Your tailored result will appear here.</div></div>
</div></div></div>
<script>
let mode="opportunity";
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active")); b.classList.add("active"); mode=b.dataset.mode;
});
document.getElementById("run").onclick=async()=>{
 const status=document.getElementById("status"), result=document.getElementById("result");
 status.textContent="LaunchKit is working…"; result.textContent="";
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({mode,target:target.value,requirements:requirements.value,background:background.value,extra:extra.value})});
  const data=await r.json(); if(!r.ok) throw new Error(data.error||"Request failed");
  result.textContent=data.output; status.textContent="";
 }catch(e){status.textContent="Could not generate: "+e.message}
};
</script></body></html>
